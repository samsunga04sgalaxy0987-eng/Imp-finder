<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Img Finder By Ankit</title>
<!-- Google Search Console Verification Meta Tag -->
<meta name="google-site-verification" content="7ZH7ygNHnAM37UD27Qv1QpG_Sl0qow9jYCg8oNYu_NQ" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Poppins', sans-serif;
}

body {
background-color: #0f172a;
color: #f8fafc;
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: space-between;
align-items: center;
padding: 20px;
}

.container {
width: 100%;
max-width: 750px;
margin-top: 50px;
text-align: center;
}

h1 {
font-size: 2.8rem;
font-weight: 600;
margin-bottom: 25px;
background: linear-gradient(135deg, #38bdf8, #818cf8);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.search-box {
display: flex;
gap: 10px;
margin-bottom: 30px;
}

input[type="text"] {
flex: 1;
padding: 14px 20px;
font-size: 16px;
border-radius: 30px;
border: 2px solid #334155;
background-color: #1e293b;
color: #fff;
outline: none;
transition: all 0.3s ease;
}

input[type="text"]:focus {
border-color: #38bdf8;
box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
}

button {
padding: 14px 28px;
font-size: 16px;
font-weight: 600;
border: none;
border-radius: 30px;
background: linear-gradient(135deg, #38bdf8, #6366f1);
color: white;
cursor: pointer;
transition: opacity 0.3s ease;
}

button:hover {
opacity: 0.9;
}

#results {
margin-top: 20px;
text-align: left;
}

.result-item {
background: #1e293b;
padding: 18px;
margin-bottom: 16px;
border-radius: 12px;
border: 1px solid #334155;
}

.result-item a {
font-size: 18px;
color: #38bdf8;
text-decoration: none;
font-weight: 600;
}

.result-item a:hover {
text-decoration: underline;
}

.result-item p {
color: #94a3b8;
font-size: 14px;
margin-top: 6px;
line-height: 1.5;
}

footer {
margin-top: 40px;
padding: 15px;
text-align: center;
font-size: 15px;
color: #94a3b8;
border-top: 1px solid #334155;
width: 100%;
max-width: 750px;
}

footer strong {
color: #38bdf8;
}
</style>
</head>
<body>

<div class="container">
<h1>Img Finder By Ankit</h1>
<div class="search-box">
<input type="text" id="searchInput" placeholder="खोजें तस्वीरें या जानकारी...">
<button onclick="performSearch()">Search</button>
</div>

<div id="results"></div>
</div>

<footer>
<p>Created by <strong>Ankit Kumar</strong></p>
</footer>

<script>
const API_KEY = "AIzaSyCOQN87p6ulvWMhQUNuOVpyTqkZKFC04";
const SEARCH_ENGINE_ID = "6127bf4f51f7540f8";

async function performSearch() {
const query = document.getElementById('searchInput').value;
const resultsDiv = document.getElementById('results');

if (!query.trim()) {
alert('कृपया खोज के लिए कुछ लिखें!');
return;
}

resultsDiv.innerHTML = '<p style="color:#94a3b8;">खोज जारी है...</p>';

const url = https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`;

try {
const response = await fetch(url);
const data = await response.json();

resultsDiv.innerHTML = '';

if (data.items && data.items.length > 0) {
data.items.forEach(item => {
const div = document.createElement('div');
div.className = 'result-item';
div.innerHTML = &lt;a href="${item.link}" target="_blank">{item.snippet}</p>
`;
resultsDiv.appendChild(div);
});
} else {
resultsDiv.innerHTML = '<p style="color:#94a3b8;">कोई परिणाम नहीं मिला।</p>';
}
} catch (error) {
console.error(error);
resultsDiv.innerHTML = '<p style="color:#f87171;">खोज के दौरान त्रुटि हुई। कृपया पुनः प्रयास करें।</p>';
}
}
</script>

</body>
</html>
